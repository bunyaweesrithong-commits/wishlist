<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<script>
  // แสดง error บนหน้าเว็บ (ช่วยหาสาเหตุเวลาค้างที่ "กำลังโหลด…")
  window.__wlErr = function (msg) {
    var m = document.getElementById('main');
    if (!m) { document.addEventListener('DOMContentLoaded', function () { window.__wlErr(msg); }); return; }
    var p = document.createElement('p');
    p.style.cssText = 'color:#e0475b;white-space:pre-wrap;padding:10px 2px';
    p.textContent = 'เกิดข้อผิดพลาด: ' + msg;
    while (m.firstChild) m.removeChild(m.firstChild);
    m.appendChild(p);
  };
  window.addEventListener('error', function (e) { window.__wlErr((e.message || 'error') + ' (line ' + e.lineno + ')'); });
  window.addEventListener('unhandledrejection', function (e) { window.__wlErr(String((e.reason && e.reason.message) || e.reason)); });
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Mitr:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#eae8fb; --bg2:#fdeee4;
    --card:#ffffff; --ink:#2a2440; --muted:#7b7493; --line:#e7e2f4;
    --accent:#6a58d6; --accent-ink:#fff;
    --plan:#ef9a2f; --pre:#3f86e6; --done:#2fa871; --danger:#e0475b;
    --card-w:260px; --radius:16px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0}
  body{
    font-family:'IBM Plex Sans Thai',system-ui,sans-serif; color:var(--ink);
    background:linear-gradient(160deg,var(--bg1) 0%,#f3f1fd 45%,var(--bg2) 100%) fixed;
    min-height:100vh; font-size:14px;
  }
  h1,h2,h3{font-family:'Mitr',sans-serif;font-weight:500;margin:0}
  button,input,select,textarea{font:inherit;color:inherit}

  /* ---------- header ---------- */
  .top{position:sticky;top:0;z-index:20;padding:16px 24px 0;
       background:rgba(246,244,253,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .row1{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
  .brand h1{font-size:24px;letter-spacing:.3px}
  .brand .sub{color:var(--muted);font-size:13px}
  .tools{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .tools input[type=search]{width:220px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;outline:none}
  .tools input[type=search]:focus{border-color:var(--accent)}
  .size{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
  .size input{width:110px;accent-color:var(--accent)}
  .tabs{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
  .tab{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);
       border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
  .tab .n{display:inline-block;min-width:22px;padding:1px 7px;margin-left:6px;border-radius:999px;background:#ece8f8;font-size:12px;color:var(--ink)}
  .tab.on{color:var(--ink);border-bottom-color:var(--c,var(--accent))}
  .tab.on .n{background:var(--c,var(--accent));color:#fff}

  .btn{border:1px solid var(--line);background:#fff;padding:9px 16px;border-radius:999px;cursor:pointer;font-weight:500}
  .btn:hover{border-color:#cfc6ec}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.primary:hover{filter:brightness(1.07)}
  .btn.small{padding:5px 12px;font-size:13px}
  .btn:disabled{opacity:.55;cursor:wait}

  /* ---------- groups & grid ---------- */
  main{padding:20px 24px 60px;max-width:1800px;margin:0 auto}
  .group{margin-bottom:34px}
  .group-title{display:flex;align-items:baseline;gap:10px;font-size:19px;margin:6px 0 14px}
  .group-title .dot{width:12px;height:12px;border-radius:50%;background:var(--c);align-self:center}
  .group-title small{font-family:'IBM Plex Sans Thai';font-size:13px;color:var(--muted);font-weight:400}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--card-w),1fr));gap:18px}
  .none,.loading{color:var(--muted);padding:10px 2px}
  .empty{text-align:center;padding:80px 20px;color:var(--muted)}
  .empty h2{color:var(--ink);margin-bottom:8px}

  /* ---------- card ---------- */
  .card{background:var(--card);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;
        box-shadow:0 1px 2px rgba(40,30,80,.06),0 6px 20px rgba(40,30,80,.07);transition:transform .15s,box-shadow .15s}
  .card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(40,30,80,.08),0 12px 28px rgba(40,30,80,.12)}
  .thumb{position:relative;aspect-ratio:3/4;background:#efecf7;cursor:zoom-in;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb.noimg,.thumb.broken{display:grid;place-items:center;cursor:default}
  .thumb.noimg::after,.thumb.broken::after{content:'ไม่มีรูป';color:#b3abcb;font-size:13px}
  .thumb.broken img{display:none}
  .thumb.broken::after{content:'โหลดรูปไม่ได้'}
  .badge{position:absolute;top:10px;left:10px;color:#fff;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;
         box-shadow:0 2px 6px rgba(0,0,0,.18)}
  .card.st-bought .thumb::before{content:'✓';position:absolute;right:10px;top:10px;width:28px;height:28px;border-radius:50%;
         background:var(--done);color:#fff;display:grid;place-items:center;font-weight:700;z-index:1}
  .body{padding:12px 14px 6px;flex:1}
  .name{font-size:15.5px;line-height:1.35;word-break:break-word}
  .price{margin-top:4px;font-weight:600;color:var(--accent)}
  .links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:5px 10px;border-radius:10px;
        background:#f2effb;border:1px solid #e6e0f6;text-decoration:none;color:var(--ink);font-size:12.5px}
  .chip:hover{background:#e9e3fb;border-color:#d5cbf3}
  .chip b{font-weight:600;white-space:nowrap}
  .chip span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip::after{content:'↗';font-size:11px;color:var(--muted)}
  .note{margin:10px 0 0;color:var(--muted);font-size:12.5px;white-space:pre-wrap;word-break:break-word}
  .foot{display:flex;align-items:center;gap:6px;padding:10px 14px 12px}
  .foot select{flex:1;min-width:0;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:#fafafe;cursor:pointer}
  .icon{border:1px solid var(--line);background:#fff;width:32px;height:32px;border-radius:10px;cursor:pointer;flex:none}
  .icon:hover{border-color:#cfc6ec}
  .icon.danger.armed{width:auto;padding:0 10px;background:var(--danger);border-color:var(--danger);color:#fff;font-size:12px}

  /* ---------- modal ---------- */
  .overlay{position:fixed;inset:0;z-index:50;background:rgba(30,24,55,.45);display:flex;align-items:flex-start;justify-content:center;
           padding:30px 16px;overflow-y:auto}
  .sheet{background:#fff;border-radius:20px;width:min(960px,100%);box-shadow:0 20px 60px rgba(20,10,60,.3)}
  .sheet-head{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
  .sheet-head h2{font-size:19px}
  .x{margin-left:auto;border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--muted)}
  .sheet-body{display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:22px;padding:20px 22px}
  @media (max-width:720px){.sheet-body{grid-template-columns:1fr}.tools input[type=search]{width:100%}.tools{width:100%}}
  .drop{position:relative;aspect-ratio:3/4;border:2px dashed #d6cdf0;border-radius:14px;background:#faf9fe;
        display:grid;place-items:center;overflow:hidden;cursor:pointer;text-align:center}
  .drop.over{border-color:var(--accent);background:#f1edff}
  .drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#f4f2fa}
  .drop-hint{color:var(--muted);font-size:13px;line-height:1.7;padding:16px}
  .uploading{position:absolute;inset:0;background:rgba(255,255,255,.75);display:grid;place-items:center;font-weight:600;color:var(--accent)}
  .img-col input{width:100%;margin-top:10px}
  .img-actions{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--muted)}
  .img-actions button{border:0;background:none;color:var(--danger);cursor:pointer;padding:0}
  .fields-col{display:flex;flex-direction:column;gap:14px}
  .fl{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:13px}
  .sheet input:not([type=file]):not([type=range]),.sheet textarea{
        padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;outline:none;font-weight:400}
  .sheet input:focus,.sheet textarea:focus{border-color:var(--accent)}
  .sheet textarea{resize:vertical}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .seg button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 6px;cursor:pointer;text-align:center;line-height:1.3}
  .seg button b{display:block;font-size:13px}
  .seg button small{color:var(--muted);font-size:11.5px}
  .seg button.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff)}
  .seg button.on b{color:var(--c)}
  .links-head{display:flex;align-items:center;justify-content:space-between;font-weight:500;font-size:13px}
  #linkRows{display:flex;flex-direction:column;gap:8px}
  .link-row{display:grid;grid-template-columns:1fr 32px;gap:6px;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fbfaff}
  .link-row .l-url{grid-column:1/2}
  .link-row .sub2{grid-column:1/2;display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .link-row .icon{grid-column:2;grid-row:1/3;align-self:start}
  .link-empty{color:var(--muted);font-size:12.5px}
  .sheet-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px 18px;border-top:1px solid var(--line)}

  /* ---------- lightbox ---------- */
  .lightbox{position:fixed;inset:0;z-index:60;background:rgba(14,10,28,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
  .lightbox img{max-width:100%;max-height:calc(100vh - 130px);object-fit:contain;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .lb-cap{margin-top:14px;color:#fff;text-align:center;cursor:default}
  .lb-cap h3{font-size:18px;margin-bottom:8px}
  .lb-cap .links{justify-content:center}
  .lb-cap .chip{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:#fff}
  .lb-cap .chip span,.lb-cap .chip::after{color:#cfc8e8}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
         background:#2a2440;color:#fff;padding:10px 18px;border-radius:999px;transition:.25s;z-index:80;font-size:13.5px}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header class="top">
  <div class="row1">
    <div class="brand">
      <h1>My Wishlist ✦</h1>
      <div class="sub" id="summary">&nbsp;</div>
    </div>
    <div class="tools">
      <input id="q" type="search" placeholder="ค้นหาชื่อของ / ร้าน / โน้ต…">
      <label class="size">ขนาดรูป <input id="size" type="range" min="180" max="460" step="20" value="260"></label>
      <button class="btn primary" id="addBtn">+ เพิ่มของ</button>
    </div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main id="main"><div class="loading">กำลังโหลด…</div></main>

<!-- Add / Edit modal -->
<div class="overlay" id="modal" hidden>
  <form class="sheet" id="form" autocomplete="off">
    <div class="sheet-head">
      <h2 id="formTitle">เพิ่มของ</h2>
      <button type="button" class="x" data-close aria-label="close">×</button>
    </div>
    <div class="sheet-body">
      <div class="img-col">
        <div class="drop" id="drop">
          <img id="preview" alt="" hidden>
          <div class="drop-hint" id="dropHint">ลากรูปมาวางตรงนี้<br>หรือกด <b>Ctrl+V</b> วางรูปที่ก๊อปไว้<br>หรือ <u>คลิกเพื่อเลือกไฟล์</u></div>
          <div class="uploading" id="uploading" hidden>กำลังอัปโหลด…</div>
        </div>
        <input type="file" id="file" accept="image/*" hidden>
        <input id="fImage" placeholder="หรือวางลิงก์รูปภาพ (URL ของไฟล์รูป)">
        <div class="img-actions"><span>รูปที่อัปโหลดจะเก็บใน Google Drive</span><button type="button" id="clearImg">ลบรูป</button></div>
      </div>

      <div class="fields-col">
        <label class="fl">ชื่อของ *
          <input id="fName" placeholder="เช่น Shigaraki Tomura birthday can badge 2021">
        </label>
        <div class="fl">สถานะ<div class="seg" id="fStatus"></div></div>
        <label class="fl">ราคา (ไม่บังคับ)
          <input id="fPrice" placeholder="เช่น ¥1,222 / 450 บาท">
        </label>
        <div>
          <div class="links-head"><span>ลิงก์ร้าน / แหล่งซื้อ (ใส่ได้หลายอัน)</span>
            <button type="button" class="btn small" id="addLink">+ เพิ่มลิงก์</button></div>
          <div id="linkRows" style="margin-top:8px"></div>
        </div>
        <label class="fl">โน้ต
          <textarea id="fNote" rows="3" placeholder="รายละเอียด, วันวางขาย, ร้านไหนคุ้มสุด ฯลฯ"></textarea>
        </label>
      </div>
    </div>
    <div class="sheet-foot">
      <button type="button" class="btn" data-close>ยกเลิก</button>
      <button type="submit" class="btn primary" id="saveBtn">บันทึก</button>
    </div>
  </form>
</div>

<div class="lightbox" id="lightbox" hidden>
  <img id="lbImg" alt="">
  <div class="lb-cap" id="lbCap"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/*
 * หมายเหตุสำคัญ: Apps Script (HtmlService) ไปแก้ไขโค้ด JS ที่มีข้อความ HTML อยู่ในสตริง
 * (โดยเฉพาะ template string แบบ backtick หลายบรรทัด) จนเกิด SyntaxError
 * ไฟล์นี้จึงสร้าง UI ทั้งหมดด้วย DOM ผ่านฟังก์ชัน h() — ห้ามใช้ backtick / ห้ามเขียน HTML เป็นสตริงใน JS
 */
var STATUS = {
  planning: { en: 'Planning to buy', th: 'อยากได้',        color: 'var(--plan)' },
  preorder: { en: 'Pre-ordered',     th: 'ซื้อแล้ว รอของ', color: 'var(--pre)' },
  bought:   { en: 'Bought',          th: 'ได้ของแล้ว',     color: 'var(--done)' }
};
var STATUS_KEYS = ['planning', 'preorder', 'bought'];
var SITE_NAMES = {
  'mercari.com': 'Mercari', 'buyee.jp': 'Buyee', 'suruga-ya.jp': 'Suruga-ya', 'lashinbang.com': 'Lashinbang',
  'amazon.co.jp': 'Amazon JP', 'amazon.com': 'Amazon', 'animate-onlineshop.jp': 'Animate', 'melonbooks.co.jp': 'Melonbooks',
  'toranoana.jp': 'Toranoana', 'x.com': 'X', 'twitter.com': 'X', 'discord.com': 'Discord', 'shopee.co.th': 'Shopee',
  'lazada.co.th': 'Lazada', 'facebook.com': 'Facebook', 'zenmarket.jp': 'ZenMarket', 'auctions.yahoo.co.jp': 'Yahoo Auctions',
  'booth.pm': 'BOOTH', 'pixiv.net': 'pixiv', 'amiami.com': 'AmiAmi', 'amiami.jp': 'AmiAmi', 'goodsmile.info': 'Good Smile',
  'jump-shop-online.com': 'Jump Shop', 'premium-bandai.com': 'P-Bandai', 'p-bandai.jp': 'P-Bandai', 'mandarake.co.jp': 'Mandarake',
  'fromjapan.co.jp': 'FromJapan', 'instagram.com': 'Instagram', 'canva.com': 'Canva'
};

var items = [], filter = 'all', query = '', editing = null, formStatus = 'planning', uploading = false;
function $(sel) { return document.querySelector(sel); }

/* ---------- utils ---------- */
function api(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (res, rej) {
    var runner = google.script.run.withSuccessHandler(res).withFailureHandler(rej);
    runner[fn].apply(runner, args);
  });
}

// h('div', { cls: 'card', css: '--c:red', data: { id: 1 }, on: { click: fn } }, child1, child2, [child3, ...])
function h(tag, props) {
  var el = document.createElement(tag);
  props = props || {};
  Object.keys(props).forEach(function (k) {
    var v = props[k];
    if (v === null || v === undefined || v === false) return;
    if (k === 'cls') el.className = v;
    else if (k === 'css') el.style.cssText = v;
    else if (k === 'data') Object.keys(v).forEach(function (d) { el.dataset[d] = v[d]; });
    else if (k === 'on') Object.keys(v).forEach(function (ev) { el.addEventListener(ev, v[ev]); });
    else el[k] = v;
  });
  appendKids(el, Array.prototype.slice.call(arguments, 2));
  return el;
}
function appendKids(el, kids) {
  kids.forEach(function (c) {
    if (c === null || c === undefined || c === false || c === '') return;
    if (Array.isArray(c)) return appendKids(el, c);
    el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  });
}
function setKids(el) {
  while (el.firstChild) el.removeChild(el.firstChild);
  appendKids(el, Array.prototype.slice.call(arguments, 1));
}

function safeUrl(u) { return /^https?:\/\//i.test(u) ? u : '#'; }
function fixUrl(u) { u = String(u || '').trim(); return !u || /^https?:\/\//i.test(u) ? u : 'https://' + u; }
function siteName(url) {
  try {
    var host = new URL(fixUrl(url)).hostname.replace(/^www\./, '');
    var parts = host.split('.');
    for (var i = 0; i < parts.length - 1; i++) {
      var s = parts.slice(i).join('.');
      if (SITE_NAMES[s]) return SITE_NAMES[s];
    }
    return host;
  } catch (e) { return 'ลิงก์'; }
}
function normalizeImg(u) {
  u = String(u || '').trim();
  var m = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]+)/);
  return m ? 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w1600' : u;
}
var toastTimer;
function toast(msg) {
  var t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
}
var store = {
  get: function (k, d) { try { var v = localStorage.getItem('wl_' + k); return v === null ? d : v; } catch (e) { return d; } },
  set: function (k, v) { try { localStorage.setItem('wl_' + k, v); } catch (e) {} }
};
function countOf(k) { return items.filter(function (i) { return i.status === k; }).length; }

/* ---------- rendering ---------- */
function linksEl(links) {
  if (!links || !links.length) return null;
  return h('div', { cls: 'links' }, links.map(function (l) {
    return h('a', { cls: 'chip', href: safeUrl(l.url), target: '_blank', rel: 'noopener noreferrer', title: l.url },
      h('b', null, l.label || siteName(l.url)),
      l.note ? h('span', null, l.note) : null);
  }));
}

function cardEl(it) {
  var s = STATUS[it.status] || STATUS.planning;
  var thumb = h('div', { cls: 'thumb' + (it.image ? '' : ' noimg'), data: { act: 'zoom' } },
    h('span', { cls: 'badge', css: 'background:' + s.color }, s.en));
  if (it.image) {
    var img = h('img', { alt: '', loading: 'lazy' });
    img.addEventListener('error', function () { thumb.classList.add('broken'); });
    img.src = it.image;
    thumb.insertBefore(img, thumb.firstChild);
  }
  var select = h('select', { title: 'เปลี่ยนสถานะ', data: { act: 'status' } },
    STATUS_KEYS.map(function (k) { return h('option', { value: k, selected: k === it.status }, STATUS[k].en); }));
  select.value = it.status;

  return h('article', { cls: 'card st-' + it.status, data: { id: it.id } },
    thumb,
    h('div', { cls: 'body' },
      h('h3', { cls: 'name' }, it.name),
      it.price ? h('div', { cls: 'price' }, it.price) : null,
      linksEl(it.links),
      it.note ? h('p', { cls: 'note' }, it.note) : null),
    h('div', { cls: 'foot' },
      select,
      h('button', { cls: 'icon', title: 'แก้ไข', data: { act: 'edit' } }, '✎'),
      h('button', { cls: 'icon danger', title: 'ลบ', data: { act: 'del' } }, '🗑')));
}

function renderTabs() {
  var tabs = [['all', 'ทั้งหมด', items.length, 'var(--accent)']].concat(
    STATUS_KEYS.map(function (k) { return [k, STATUS[k].en, countOf(k), STATUS[k].color]; }));
  setKids($('#tabs'), tabs.map(function (t) {
    return h('button', { cls: 'tab' + (filter === t[0] ? ' on' : ''), css: '--c:' + t[3], data: { f: t[0] } },
      t[1], h('span', { cls: 'n' }, String(t[2])));
  }));
  $('#summary').textContent = items.length
    ? 'อยากได้ ' + countOf('planning') + ' · รอของ ' + countOf('preorder') + ' · ได้แล้ว ' + countOf('bought')
    : 'ยังไม่มีของในลิสต์';
}

function render() {
  renderTabs();
  var main = $('#main');
  if (!items.length) {
    setKids(main, h('div', { cls: 'empty' },
      h('h2', null, 'Wishlist ยังว่างอยู่'),
      h('p', null, 'กด “+ เพิ่มของ” เพื่อเริ่มเพิ่มของชิ้นแรก')));
    return;
  }
  var q = query.trim().toLowerCase();
  var list = items.filter(function (it) {
    if (!q) return true;
    var text = [it.name, it.note, it.price].concat(it.links.map(function (l) {
      return (l.label || siteName(l.url)) + ' ' + l.note;
    })).join(' ').toLowerCase();
    return text.indexOf(q) >= 0;
  }).sort(function (a, b) { return b.updatedAt - a.updatedAt; });

  var keys = filter === 'all' ? STATUS_KEYS : [filter];
  var sections = [];
  keys.forEach(function (k) {
    var group = list.filter(function (i) { return i.status === k; });
    if (filter === 'all' && !group.length) return;
    sections.push(h('section', { cls: 'group' },
      h('h2', { cls: 'group-title', css: '--c:' + STATUS[k].color },
        h('span', { cls: 'dot' }), STATUS[k].en,
        h('small', null, STATUS[k].th + ' · ' + group.length + ' ชิ้น')),
      group.length ? h('div', { cls: 'grid' }, group.map(cardEl))
                   : h('p', { cls: 'none' }, 'ยังไม่มีของในหมวดนี้')));
  });
  setKids(main, sections.length ? sections : h('p', { cls: 'none' }, 'ไม่พบของที่ค้นหา'));
}

/* ---------- main list events ---------- */
$('#tabs').addEventListener('click', function (e) {
  var b = e.target.closest('[data-f]'); if (!b) return;
  filter = b.dataset.f; store.set('filter', filter); render();
});
$('#q').addEventListener('input', function (e) { query = e.target.value; render(); });
$('#size').addEventListener('input', function (e) {
  document.documentElement.style.setProperty('--card-w', e.target.value + 'px'); store.set('size', e.target.value);
});
$('#addBtn').addEventListener('click', function () { openForm(null); });

$('#main').addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]'); if (!el) return;
  var card = el.closest('.card'); if (!card) return;
  var it = items.find(function (i) { return i.id === card.dataset.id; }); if (!it) return;
  var act = el.dataset.act;
  if (act === 'zoom' && it.image && !el.classList.contains('broken')) openLightbox(it);
  if (act === 'edit') openForm(it);
  if (act === 'del') {
    if (el.dataset.armed) { doDelete(it); return; }
    el.dataset.armed = '1'; el.classList.add('armed'); el.textContent = 'ยืนยันลบ?';
    setTimeout(function () {
      if (el.isConnected) { delete el.dataset.armed; el.classList.remove('armed'); el.textContent = '🗑'; }
    }, 3000);
  }
});
$('#main').addEventListener('change', function (e) {
  if (e.target.dataset.act !== 'status') return;
  var id = e.target.closest('.card').dataset.id;
  var it = items.find(function (i) { return i.id === id; });
  var prev = it.status;
  it.status = e.target.value; it.updatedAt = Date.now(); render();
  api('setStatus', id, it.status)
    .then(function (saved) { Object.assign(it, saved); toast('ย้ายไป “' + STATUS[it.status].en + '” แล้ว'); })
    .catch(function (err) { it.status = prev; render(); toast('เปลี่ยนสถานะไม่สำเร็จ: ' + (err.message || err)); });
});

function doDelete(it) {
  var idx = items.indexOf(it); items.splice(idx, 1); render();
  api('deleteItem', it.id)
    .then(function () { toast('ลบแล้ว'); })
    .catch(function (err) { items.splice(idx, 0, it); render(); toast('ลบไม่สำเร็จ: ' + (err.message || err)); });
}

/* ---------- lightbox ---------- */
function openLightbox(it) {
  $('#lbImg').src = it.image;
  setKids($('#lbCap'), h('h3', null, it.name), linksEl(it.links));
  $('#lightbox').hidden = false;
}
$('#lightbox').addEventListener('click', function (e) { if (!e.target.closest('.lb-cap')) $('#lightbox').hidden = true; });

/* ---------- form ---------- */
function renderSeg(val) {
  formStatus = val;
  setKids($('#fStatus'), STATUS_KEYS.map(function (k) {
    return h('button', { type: 'button', cls: k === val ? 'on' : '', css: '--c:' + STATUS[k].color, data: { k: k } },
      h('b', null, STATUS[k].en), h('small', null, STATUS[k].th));
  }));
}
$('#fStatus').addEventListener('click', function (e) { var b = e.target.closest('[data-k]'); if (b) renderSeg(b.dataset.k); });

function refreshLinkEmpty() {
  var box = $('#linkRows');
  var empty = box.querySelector('.link-empty');
  var hasRow = !!box.querySelector('.link-row');
  if (!hasRow && !empty) setKids(box, h('div', { cls: 'link-empty' }, 'ยังไม่มีลิงก์ — กด “+ เพิ่มลิงก์” เพื่อแนบร้านต่างๆ ไว้เทียบ'));
  if (hasRow && empty) empty.remove();
}
function addLinkRow(l) {
  l = l || {};
  var url = h('input', { cls: 'l-url', placeholder: 'วางลิงก์ เช่น https://jp.mercari.com/item/…', value: l.url || '' });
  var label = h('input', { cls: 'l-label', value: l.label || '' });
  var note = h('input', { cls: 'l-note', placeholder: 'ราคา / ค่าส่ง / หมายเหตุ', value: l.note || '' });
  var row = h('div', { cls: 'link-row' }, url, h('div', { cls: 'sub2' }, label, note),
    h('button', { type: 'button', cls: 'icon', title: 'ลบลิงก์', on: { click: function () { row.remove(); refreshLinkEmpty(); } } }, '×'));
  function upd() { label.placeholder = url.value.trim() ? siteName(url.value) + ' (อัตโนมัติ)' : 'ชื่อร้าน (เว้นว่าง = อัตโนมัติ)'; }
  url.addEventListener('input', upd); upd();
  $('#linkRows').appendChild(row); refreshLinkEmpty();
  return row;
}
$('#addLink').addEventListener('click', function () { addLinkRow().querySelector('.l-url').focus(); });

function setPreview(src) {
  var p = $('#preview');
  if (src) { p.src = src; p.hidden = false; $('#dropHint').hidden = true; }
  else { p.removeAttribute('src'); p.hidden = true; $('#dropHint').hidden = false; }
}
$('#preview').addEventListener('error', function () {
  if ($('#preview').getAttribute('src')) toast('โหลดรูปจากลิงก์นี้ไม่ได้ — ลองอัปโหลดไฟล์แทน');
});

function openForm(it) {
  editing = it;
  $('#formTitle').textContent = it ? 'แก้ไขของ' : 'เพิ่มของ';
  $('#fName').value = it ? it.name : '';
  $('#fPrice').value = it ? it.price : '';
  $('#fNote').value = it ? it.note : '';
  $('#fImage').value = it ? it.image : '';
  setPreview(it ? it.image : '');
  renderSeg(it ? it.status : (filter !== 'all' ? filter : 'planning'));
  setKids($('#linkRows'));
  (it && it.links.length ? it.links : [{}]).forEach(function (l) { addLinkRow(l); });
  $('#modal').hidden = false;
  setTimeout(function () { $('#fName').focus(); }, 30);
}
function closeForm() {
  if (uploading) { toast('รออัปโหลดรูปเสร็จก่อนนะ'); return; }
  $('#modal').hidden = true; editing = null;
}
document.querySelectorAll('[data-close]').forEach(function (b) { b.addEventListener('click', closeForm); });
$('#modal').addEventListener('mousedown', function (e) { if (e.target.id === 'modal') closeForm(); });

$('#fImage').addEventListener('change', function (e) { e.target.value = normalizeImg(e.target.value); setPreview(e.target.value); });
$('#clearImg').addEventListener('click', function () { $('#fImage').value = ''; setPreview(''); });

/* image upload: click / drag-drop / paste */
var drop = $('#drop');
drop.addEventListener('click', function () { $('#file').click(); });
$('#file').addEventListener('change', function (e) { if (e.target.files[0]) handleImageFile(e.target.files[0]); e.target.value = ''; });
drop.addEventListener('dragover', function (e) { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', function () { drop.classList.remove('over'); });
drop.addEventListener('drop', function (e) {
  e.preventDefault(); drop.classList.remove('over');
  var f = Array.prototype.find.call(e.dataTransfer.files, function (f) { return f.type.indexOf('image/') === 0; });
  if (f) { handleImageFile(f); return; }
  var url = e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain');
  if (url) { $('#fImage').value = normalizeImg(url); setPreview($('#fImage').value); }
});
document.addEventListener('paste', function (e) {
  if ($('#modal').hidden || !e.clipboardData) return;
  var f = Array.prototype.find.call(e.clipboardData.items, function (i) { return i.type.indexOf('image/') === 0; });
  if (f) { e.preventDefault(); handleImageFile(f.getAsFile()); }
});

function readAsDataUrl(file) {
  return new Promise(function (res, rej) {
    var r = new FileReader(); r.onload = function () { res(r.result); }; r.onerror = rej; r.readAsDataURL(file);
  });
}
function shrink(file, max) {
  max = max || 1600;
  return readAsDataUrl(file).then(function (url) {
    if (file.type === 'image/gif') return url;
    return new Promise(function (res, rej) {
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        var ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.9));
      };
      img.onerror = rej;
      img.src = url;
    });
  });
}
function handleImageFile(file) {
  if (uploading) return;
  uploading = true; $('#uploading').hidden = false; $('#saveBtn').disabled = true;
  shrink(file).then(function (dataUrl) {
    setPreview(dataUrl);
    var name = String(file.name || 'pasted').replace(/\.[^.]+$/, '') + '_' + Date.now() + '.jpg';
    return api('uploadImage', dataUrl, name);
  }).then(function (url) {
    $('#fImage').value = url; toast('อัปโหลดรูปแล้ว');
  }).catch(function (err) {
    toast('อัปโหลดไม่สำเร็จ: ' + ((err && err.message) || err));
    setPreview($('#fImage').value);
  }).then(function () {
    uploading = false; $('#uploading').hidden = true; $('#saveBtn').disabled = false;
  });
}

$('#form').addEventListener('submit', function (e) {
  e.preventDefault();
  if (uploading) { toast('รออัปโหลดรูปเสร็จก่อนนะ'); return; }
  var name = $('#fName').value.trim();
  if (!name) { $('#fName').focus(); toast('ใส่ชื่อของก่อนนะ'); return; }
  var links = Array.prototype.map.call(document.querySelectorAll('.link-row'), function (r) {
    return {
      url: fixUrl(r.querySelector('.l-url').value),
      label: r.querySelector('.l-label').value.trim(),
      note: r.querySelector('.l-note').value.trim()
    };
  }).filter(function (l) { return l.url; });
  var data = {
    id: editing ? editing.id : '', createdAt: editing ? editing.createdAt : 0,
    name: name, image: normalizeImg($('#fImage').value), status: formStatus,
    price: $('#fPrice').value.trim(), note: $('#fNote').value.trim(), links: links
  };
  var btn = $('#saveBtn'); btn.disabled = true; btn.textContent = 'กำลังบันทึก…';
  api('saveItem', data).then(function (saved) {
    var i = items.findIndex(function (x) { return x.id === saved.id; });
    if (i >= 0) items[i] = saved; else items.push(saved);
    $('#modal').hidden = true; editing = null; render(); toast('บันทึกแล้ว ✓');
  }).catch(function (err) {
    toast('บันทึกไม่สำเร็จ: ' + ((err && err.message) || err));
  }).then(function () {
    btn.disabled = false; btn.textContent = 'บันทึก';
  });
});

document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  if (!$('#lightbox').hidden) $('#lightbox').hidden = true;
  else if (!$('#modal').hidden) closeForm();
});

/* ---------- init ---------- */
(function init() {
  filter = store.get('filter', 'all');
  if (filter !== 'all' && !STATUS[filter]) filter = 'all';
  var size = store.get('size', '260');
  $('#size').value = size; document.documentElement.style.setProperty('--card-w', size + 'px');
  renderTabs();
  api('getItems')
    .then(function (list) { items = list || []; render(); })
    .catch(function (err) { setKids($('#main'), h('p', { cls: 'none' }, 'โหลดข้อมูลไม่สำเร็จ: ' + ((err && err.message) || err))); });
})();
</script>
</body>
</html>
